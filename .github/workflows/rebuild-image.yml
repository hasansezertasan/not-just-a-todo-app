---
name: Weekly Image Rebuild
on:
  schedule:
    # Picks up base-image (python:3.14-slim-bookworm) security patches even
    # when no commits land. New CVEs in the base layer otherwise persist
    # until the next code change.
    - cron: "0 7 * * 1"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # Force fresh base layer pull so weekly run actually picks up
          # upstream security patches.
          pull: true
          no-cache: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:weekly
            ghcr.io/${{ github.repository }}:weekly-${{ github.run_number }}
